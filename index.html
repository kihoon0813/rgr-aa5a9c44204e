<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>데이터 대시보드</title>
<style>
/* ───────── 색·유리 토큰 (색을 바꾸려면 여기) ───────── */
:root{
  --accent:#2563eb; --accent-2:#3b82f6; --accent-ink:#fff;
  --run:#2563eb; --wait:#f59e0b; --fail:#dc2626; --done:#9ca3af;
  --ink:#111827; --ink-2:#374151; --mute:#4b5563; --line:rgba(17,24,39,.10);
  --glass:rgba(255,255,255,.60); --glass-strong:rgba(255,255,255,.82); --solid:#ffffff;
  --glass-border:rgba(255,255,255,.55); --glass-hi:rgba(255,255,255,.85);
  --shadow:0 18px 50px -12px rgba(30,41,90,.22), 0 4px 14px -6px rgba(30,41,90,.10);
  --blur:blur(22px) saturate(160%);
  --bg-a:#c9e6ff; --bg-b:#ddd3ff; --bg-c:#ffd9e8; --bg-base:#eef2ff;
  --code-bg:rgba(15,23,42,.06); --chip:rgba(255,255,255,.7);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",Consolas,monospace;
  --col:680px; --side:260px; --panel:360px;
}
html[data-theme="dark"]{
  --ink:#f3f4f6; --ink-2:#e5e7eb; --mute:#c3c8d4; --line:rgba(255,255,255,.10);
  --glass:rgba(0,0,0,.45); --glass-strong:rgba(14,16,34,.86); --solid:#151833;
  --glass-border:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
  --shadow:0 22px 60px -14px rgba(0,0,0,.6), 0 4px 16px -6px rgba(0,0,0,.4);
  --bg-a:#0b1438; --bg-b:#2a1654; --bg-c:#151040; --bg-base:#090b1f;
  --code-bg:rgba(255,255,255,.07); --chip:rgba(255,255,255,.08);
  --accent:#3b82f6; --accent-2:#60a5fa;
}
@media (prefers-reduced-transparency: reduce){
  :root{--glass:#f7f8fc; --blur:none}
  html[data-theme="dark"]{--glass:#14172e}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg-base);overflow:hidden;-webkit-font-smoothing:antialiased}
html.theme-anim *, html.theme-anim *::before{transition:background-color .2s ease,color .2s ease,border-color .2s ease,fill .2s ease!important}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;
  background:radial-gradient(40% 45% at 20% 25%,var(--bg-a),transparent 70%),
             radial-gradient(45% 50% at 80% 30%,var(--bg-b),transparent 70%),
             radial-gradient(50% 50% at 50% 85%,var(--bg-c),transparent 70%),var(--bg-base);
  animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(3%,-2%) rotate(4deg)}100%{transform:translate(-3%,2%) rotate(-3deg)}}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi)}
.mono{font-family:var(--mono)}
.icon-btn{width:36px;height:36px;border-radius:999px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--chip);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px;display:block}
#toBottom{padding:0}
/* ───────── 전체 배치 ───────── */
#app{display:flex;height:100vh;padding:12px;gap:12px}
#side{width:var(--side);flex:none;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;transition:width .2s,margin .2s,opacity .2s}
body.side-collapsed #side{width:0;margin-left:-12px;opacity:0;border:0}
#main{flex:1;min-width:0;position:relative;border-radius:20px;overflow:hidden}
#panel{width:var(--panel);flex:none;border-radius:20px;display:none;flex-direction:column;overflow:hidden}
body.panel-open #panel{display:flex}
/* 사이드바 */
.side-top{padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px}
.new-btn{display:flex;align-items:center;gap:8px;justify-content:center;height:40px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 18px -6px rgba(37,99,235,.6)}
.new-btn:hover{filter:brightness(1.07)}
.search{height:38px;border-radius:999px;border:1px solid var(--line);background:var(--chip);padding:0 14px;color:var(--ink);font:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--accent)}
.side-scroll{flex:1;overflow:auto;padding:4px 10px 14px}
.side-h{font-size:12px;font-weight:700;color:var(--mute);margin:14px 6px 6px;letter-spacing:.02em}
.wf-item,.cv-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:10px;font-size:14px;color:var(--ink)}
.wf-item:hover,.cv-item:hover{background:var(--chip)}
.cv-item.on{background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--line)}
.cv-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-x{opacity:0;border:0;background:none;color:var(--mute);font-size:16px;padding:0 4px}
.cv-item:hover .cv-x,.wf-item:hover .cv-x{opacity:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.running{background:var(--run);animation:pulse 1.6s ease-in-out infinite}
.dot.running{box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.dot.approval{background:var(--wait);animation:pulse 1s ease-in-out infinite}.dot.failed{background:var(--fail)}
.dot.done{width:auto;height:auto;background:none;border-radius:0;color:#16a34a;font-size:13px;font-weight:800;line-height:1}.dot.done::before{content:"✓"}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.snip{font-size:12px;color:var(--mute);padding:0 10px 6px 26px;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 상단 상태 막대 */
#top{position:absolute;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:20px 20px 0 0;border-width:0 0 1px 0}
#top .center{flex:1;display:flex;justify-content:center;min-width:0}
#statusBtn{display:flex;align-items:center;gap:10px;max-width:100%;border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;color:var(--ink)}
#statusBtn:hover{background:var(--chip)}
#statusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--done);flex:none}
.working .sdot{background:var(--run);animation:pulse 1.6s ease-in-out infinite}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
#prog.indet i{width:30%;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.right{display:flex;align-items:center;gap:4px}
#setBtn{margin-left:10px}
.badge{position:relative}
.badge b{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--wait);color:#1f1300;font-size:11px;line-height:18px;text-align:center;font-weight:800}
.usage{font-size:12px;color:var(--mute);padding:0 6px;white-space:nowrap}
.stop-btn{height:32px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:var(--bg-base);font-weight:700;font-size:13px;display:none}
.working .stop-btn{display:inline-block}
.drop{position:absolute;z-index:40;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none}
.drop.show{display:block}
#stepsDrop{top:52px;left:50%;transform:translateX(-50%);width:min(520px,90%);max-height:60vh;overflow:auto}
.step{padding:8px 10px;border-radius:8px;font-size:13px}
.step summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.step summary::-webkit-details-marker{display:none}
.step pre{margin:6px 0 0;max-height:200px;overflow:auto;font-size:12px;background:var(--code-bg);padding:8px;border-radius:8px;white-space:pre-wrap}
.todo{display:flex;gap:8px;padding:6px 10px;font-size:13px}.todo.done{color:var(--mute);text-decoration:line-through}.todo.cur{color:var(--accent);font-weight:700}
#apDrop{top:52px;right:60px;width:340px;max-height:60vh;overflow:auto}
.ap-row{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-size:13px}
.ap-row:hover{background:var(--code-bg)}
/* 대화 영역 */
#scroller{position:absolute;inset:0;overflow:auto;padding:76px 20px 190px;scroll-behavior:smooth}
#msgs{max-width:var(--col);margin:0 auto;display:flex;flex-direction:column}
.row{display:flex;flex-direction:column;margin-top:14px;position:relative}
.row.cont{margin-top:4px}
.row.user{align-items:flex-end}.row.asst{align-items:flex-start}
.bubble{max-width:88%;padding:11px 16px;border-radius:18px;word-break:keep-all;overflow-wrap:anywhere}
.row.enter{animation:rise .2s ease-out}  /* 말풍선이 처음 나타날 때 한 번만 (글자가 흐르는 동안 다시 재생되면 깜빡임) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.user .bubble{background:linear-gradient(135deg,#2563eb,#3b82f6 60%,#4f7cf7);color:#fff;box-shadow:0 10px 24px -10px rgba(37,99,235,.55)}
.user.tail .bubble{border-bottom-right-radius:6px}
.asst .bubble{max-width:100%;width:100%}
.asst.tail .bubble{border-bottom-left-radius:6px}
.user .bubble a{color:#fff}
.time{font-size:11px;color:var(--mute);opacity:0;transition:opacity .15s;margin:2px 8px 0;height:0;overflow:visible}
.row:hover .time{opacity:1}
.msg-actions{display:flex;gap:2px;margin:4px 0 0 6px;opacity:0;transition:opacity .15s}
.row.asst:hover .msg-actions{opacity:1}
.msg-actions button{border:0;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.msg-actions button:hover{background:var(--glass-strong)}
.dept{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-bottom:6px}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bounce 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
/* 마크다운 */
.md p{margin:.35em 0}.md p:first-child{margin-top:0}.md p:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{font-size:1.05em;margin:.8em 0 .3em}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
.md code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.md a{color:var(--accent)}
.md blockquote{margin:.4em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--mute)}
.md table{border-collapse:collapse;margin:.5em 0;font-size:14px;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.md th{background:var(--code-bg)}
.code{position:relative;margin:.5em 0;background:var(--code-bg);border:1px solid var(--line);border-radius:12px}
.code pre{margin:0;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.55}
.code .lang{position:absolute;top:6px;left:12px;font-size:11px;color:var(--mute);font-family:var(--mono)}
.code .lang+pre{padding-top:26px}
.copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--solid);border-radius:999px;font-size:11px;padding:2px 9px}
/* 도구 칩 */
.tools{margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:2px 11px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--accent)}
.chip .car{transition:transform .15s}.tools.open .chip .car{transform:rotate(90deg)}
.tool-list{display:none;margin-top:6px;border-left:2px solid var(--line);padding-left:10px}
.tools.open .tool-list{display:block}
.tl-item{font-size:12.5px;margin:6px 0}
.tl-item pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:180px;overflow:auto;background:var(--code-bg);padding:6px 8px;border-radius:8px;margin:4px 0 0}
.tl-item.err .tl-name{color:var(--fail)}
/* 파일 카드 */
.fcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--solid);border-radius:14px;padding:9px 12px;margin:8px 0;max-width:420px}
.fcard .fi{font-size:22px}
.fcard .fn{flex:1;min-width:0}.fcard .fn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fn span{font-size:11.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard.undone{opacity:.6}.fcard.undone b{text-decoration:line-through}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.pill.blue{background:var(--accent);color:#fff;border-color:transparent}
.pill:disabled{opacity:.45;cursor:not-allowed}
/* 승인 카드 */
.apcard{border:1.5px solid var(--wait);border-radius:16px;background:var(--solid);padding:12px 14px;margin:10px 0;position:relative;outline:none}
.apcard:focus{box-shadow:0 0 0 3px rgba(245,158,11,.3)}
.apcard h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.apcard h4 .tag{font-size:11px;background:var(--wait);color:#1f1300;border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none}
.apcard.closed{border-color:var(--line)}
.apcard.closed h4 .tag{background:var(--done);color:#fff}
.apcard h4 .tag.s-approved{background:var(--run);color:#fff}
.apcard.closed h4 .tag.s-done{background:#16a34a}
/* 진행 표시줄 */
.live{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(37,99,235,.08);color:var(--run);font-size:13px;font-weight:600;position:relative;overflow:hidden}
.live .typing{padding:0}.live .typing i{background:var(--run)}
.live::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:30%;background:var(--run);animation:indet 1.4s ease-in-out infinite}
.live.wait{background:rgba(245,158,11,.14);color:#b45309}.live.wait::after{background:var(--wait)}
.fin{margin-top:10px;font-size:13px;font-weight:600;color:#15803d}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba div{min-width:0}.ba small{font-size:11px;color:var(--mute);font-weight:700}
.ba pre{margin:2px 0 0;font-family:var(--mono);font-size:11.5px;background:var(--code-bg);border-radius:8px;padding:8px;max-height:180px;overflow:auto;white-space:pre-wrap}
.ap-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ap-note{display:none;margin-top:8px;gap:6px}.ap-note.show{display:flex}
.ap-note input{flex:1;height:32px;border-radius:999px;border:1px solid var(--line);padding:0 12px;background:var(--chip);color:var(--ink);font:inherit;font-size:13px}
.ap-hint{font-size:11px;color:var(--mute);margin-left:auto}
.check{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.check svg{width:54px;height:54px;color:var(--accent);animation:ck .7s ease-out forwards}
@keyframes ck{0%{opacity:0;transform:scale(.5)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.err-box{color:var(--fail);font-size:13px;border:1px solid rgba(220,38,38,.35);border-radius:10px;padding:8px 10px;margin-top:6px;white-space:pre-wrap}
.note{font-size:12px;color:var(--mute);margin-top:4px}
/* 입력창 */
#dock{position:absolute;left:0;right:0;bottom:18px;z-index:15;padding:0 16px;transition:bottom .4s cubic-bezier(.2,.8,.2,1),transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#dock>*{pointer-events:auto}
#dockIn{max-width:var(--col);margin:0 auto;position:relative}
body.empty #dock{bottom:50%;transform:translateY(50%)}
.hello{display:none;text-align:center;margin-bottom:22px}
.hello h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}.hello p{margin:0;color:var(--mute)}
body.empty .hello,body.empty .home-extra{display:block}
.home-extra{display:none;margin-top:18px}
.wf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wf-card{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:16px;padding:12px 14px;text-align:left;box-shadow:inset 0 1px 0 var(--glass-hi)}
.wf-card:hover{border-color:var(--accent)}
.wf-card b{display:block;font-size:14px;margin-top:2px}.wf-card span{font-size:12px;color:var(--mute)}
.stats{display:flex;justify-content:center;gap:28px;margin-top:16px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:18px;color:var(--ink);text-align:center}
/* ───────── 홈 대시보드 ───────── */
#dash{display:none;max-width:none;width:100%;margin:0 auto}
body.empty #dash{display:block}
body.empty #dock{bottom:18px;transform:none}
body.empty .hello,body.empty .home-extra{display:none}
.d-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.d-head h1{font-size:24px;margin:0;letter-spacing:-.02em}.d-head p{margin:2px 0 0;color:var(--mute);font-size:13px}
.d-sync{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
.d-sync button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
.d-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.d-card{grid-column:span 6;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:18px;padding:14px 16px;box-shadow:inset 0 1px 0 var(--glass-hi);min-width:0}
.d-card.w3{grid-column:span 3}.d-card.w4{grid-column:span 4}.d-card.w8{grid-column:span 8}
.d-card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-card h3 em{font-style:normal;font-weight:400;font-size:12px;color:var(--mute)}
.kpi .v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--ink)}
.kpi .v small{font-size:14px;font-weight:500;color:var(--mute);margin-left:3px}
.kpi .l{font-size:12.5px;color:var(--mute);margin-top:4px}
.kpi.alert .v{color:var(--fail)}
.kpi.btn{cursor:pointer}.kpi.btn:hover{border-color:var(--accent)}
.d-sum{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--mute)}
.d-sum button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2)}
.d-sum button b{color:var(--ink);margin-left:3px}.d-sum button.hot{border-color:var(--fail)}.d-sum button.hot b{color:var(--fail)}
.d-warn{margin:0 0 12px;padding:8px 12px;border-radius:12px;font-size:12.5px;background:rgba(245,158,11,.16);color:#b45309}
.d-warn.bad{background:rgba(220,38,38,.12);color:var(--fail)}
.m-bulk{margin:0 0 8px}.m-bulk button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:4px 12px;font-size:12.5px}
.sl-it.old{border-left:3px solid var(--fail);padding-left:9px}.sl-age{color:var(--fail);font-weight:600}
.d-na{color:var(--mute);font-size:12.5px;padding:18px 4px;text-align:center;line-height:1.6}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
